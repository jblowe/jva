# Apache virtual host for the search app: /etc/apache2/sites-available/jva.johnblowe.com.conf
# Needs mod_proxy, mod_proxy_http and mod_headers. certbot --apache adds the HTTPS twin
# (jva.johnblowe.com-le-ssl.conf) from this file and redirects http to https.
<VirtualHost *:80>
    ServerName jva.johnblowe.com

    # Preview images and the PDF/RTF copies: served by Apache straight from the folder
    # publish.py uploads to (the app links to /derivatives/... in public mode).
    Alias /derivatives/ /srv/jva-data/derivatives/
    <Directory /srv/jva-data/derivatives>
        Options -Indexes
        AllowOverride None
        Require all granted
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=604800"
        </IfModule>
    </Directory>
    AddType image/webp .webp
    AddType application/rtf .rtf

    # Everything else: the app, under gunicorn (deploy/gunicorn.conf.py, deploy/jva.service).
    ProxyPreserveHost On
    ProxyPass        /derivatives/ !
    ProxyPass        /  http://127.0.0.1:8007/
    ProxyPassReverse /  http://127.0.0.1:8007/

    # To restrict the whole site later, uncomment (an .htaccess file would only cover
    # /derivatives/, not the app's pages) and create the password file with
    #   sudo htpasswd -c /etc/apache2/jva.htpasswd someone
    # <Location />
    #     AuthType Basic
    #     AuthName "Voelker Archive"
    #     AuthUserFile /etc/apache2/jva.htpasswd
    #     Require valid-user
    # </Location>

    ErrorLog  ${APACHE_LOG_DIR}/jva_error.log
    CustomLog ${APACHE_LOG_DIR}/jva_access.log combined
</VirtualHost>
